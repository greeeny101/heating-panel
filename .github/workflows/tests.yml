name: Tests

on:
  push:
  pull_request:

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # HACS installs the built panel from the repository, so it must match the source.
      - run: npm run build
      - name: Built panel is up to date
        run: git diff --exit-code custom_components/heating_panel/frontend || (echo "Run npm run build and commit the result." && exit 1)

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # ruff is pinned so a new release can't fail the build; its settings are in ruff.toml.
      - run: pip install pytest ruff==0.17.3
      - run: ruff check custom_components python-tests
      - run: python -m pytest python-tests -q
